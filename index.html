<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Assessment</title>
</head>
<body>

<!-- Section 1: Timer -->
<h2>Timer: <span id="timer">0</span> seconds</h2>

<button id="start-btn">Start Timer</button>
<button id="stop-btn">Stop Timer</button>

<!-- Section 2: User Info -->
<h2>Add User</h2>

<input type="text" id="user-name" placeholder="Enter Name">
<input type="number" id="user-age" placeholder="Enter Age">

<button id="add-user-btn">Add User</button>

<p id="user-display">No user added</p>
 
  

<h2>My Shopping List</h2>

<input type="text" id="item-input" placeholder="Enter item name">
<button id="add-item-btn">Add Item</button>

<div id="list-container" style="padding: 10px; border: 1px solid #ccc;">
    <ul id="item-list">
        <li>
            Apples
            <button class="edit-btn">Edit</button>
            <button class="delete-btn">Delete</button>
        </li>
        <li>
            Bread
            <button class="edit-btn">Edit</button>
            <button class="delete-btn">Delete</button>
        </li>
    </ul>
</div>
  <script src="javascript.js"></script>
  <link rel="stylesheet" href="style.css">
</body>
</html>
